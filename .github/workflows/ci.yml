name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: 格式检查
        run: npm run format:check

      - name: 代码规范
        run: npm run lint

      - name: 项目结构校验
        run: npm run validate

      - name: 文档一致性校验
        run: npm run validate:docs

      - name: 单元测试
        run: npm test
